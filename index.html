    <script>
        /**
         * =========================================================================
         * INSTRUCCIONES DE CONFIGURACIÓN:
         * 1. Despliega tu Google Apps Script como "Aplicación Web".
         * 2. Configura "Quién tiene acceso" en "Cualquier persona".
         * 3. Pega la URL generada en la siguiente variable SCRIPT_URL.
         * =========================================================================
         */
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4W-rK2hc5_ZZ2SwgMpNs3Qk3okvSKHEOgx33mvjPhkmEOfi1BOn01hgLovLpy-3mK/exec';

        let selectedFiles = [];

        // Inicializar eventos de Drag & Drop
        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('bg-gold-100/50'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('bg-gold-100/50'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFilesSelected(files);
        });

        // Manejar la selección de archivos
        function handleFilesSelected(files) {
            if (!files || files.length === 0) return;

            const newFiles = Array.from(files);
            selectedFiles = [...selectedFiles, ...newFiles];

            renderPreviews();
        }

        // Renderizar miniaturas de previas
        function renderPreviews() {
            const container = document.getElementById('previewContainer');
            const fileCountEl = document.getElementById('fileCount');
            const previewSection = document.getElementById('previewSection');
            
            container.innerHTML = '';
            fileCountEl.innerText = selectedFiles.length;

            if (selectedFiles.length === 0) {
                previewSection.classList.add('hidden');
                dropZone.classList.remove('hidden');
                return;
            }

            previewSection.classList.remove('hidden');

            selectedFiles.forEach((file, index) => {
                const isVideo = file.type.startsWith('video/');
                const card = document.createElement('div');
                card.className = 'relative flex-shrink-0 w-20 h-20 rounded-lg overflow-hidden border border-slate-200 bg-slate-100 shadow-sm group';

                const removeBtn = document.createElement('button');
                removeBtn.className = 'absolute top-1 right-1 bg-black/60 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] z-10 hover:bg-rose-600 transition-colors';
                removeBtn.innerHTML = '✕';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeFile(index);
                };

                if (isVideo) {
                    card.innerHTML = `
                        <div class="w-full h-full flex flex-col items-center justify-center bg-slate-800 text-white">
                            <i class="fa-solid fa-video text-lg text-gold-300"></i>
                            <span class="text-[9px] truncate max-w-[70px] mt-1 px-1">${file.name}</span>
                        </div>
                    `;
                } else {
                    const img = document.createElement('img');
                    img.className = 'w-full h-full object-cover';
                    img.src = URL.createObjectURL(file);
                    card.appendChild(img);
                }

                card.appendChild(removeBtn);
                container.appendChild(card);
            });
        }

        // Remover un archivo específico
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        // Reiniciar la selección completa
        function resetSelection() {
            selectedFiles = [];
            document.getElementById('fileInput').value = '';
            renderPreviews();
        }

        // --- FUNCIONES DE SUBIDA Y ENVÍO A GOOGLE DRIVE ---

        async function startUploadProcess() {
            if (selectedFiles.length === 0) return;

            const previewSection = document.getElementById('previewSection');
            const dropZone = document.getElementById('dropZone');
            const progressSection = document.getElementById('progressSection');
            const statusMessage = document.getElementById('statusMessage');
            const fileProgressText = document.getElementById('fileProgressText');
            const progressBar = document.getElementById('progressBar');
            const progressPercentage = document.getElementById('progressPercentage');

            // Ocultar selector y mostrar barra de carga
            previewSection.classList.add('hidden');
            dropZone.classList.add('hidden');
            progressSection.classList.remove('hidden');

            let uploadedCount = 0;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                fileProgressText.innerText = `Subiendo foto ${i + 1} de ${selectedFiles.length}...`;

                try {
                    const base64 = await convertToBase64(file);
                    const payload = {
                        fileName: file.name,
                        mimeType: file.type,
                        fileData: base64.split(',')[1]
                    };

                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });

                    uploadedCount++;
                    const percent = Math.round((uploadedCount / selectedFiles.length) * 100);
                    progressBar.style.width = percent + '%';
                    progressPercentage.innerText = percent + '%';

                } catch (error) {
                    console.error('Error al subir el archivo:', error);
                }
            }

            // Mostrar pantalla de éxito al finalizar
            progressSection.classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function resetApp() {
            selectedFiles = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('dropZone').classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressPercentage').innerText = '0%';
        }
    </script>
</body>
</html>
